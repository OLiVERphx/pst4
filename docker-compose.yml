version: '3.8'
services:
  ml-service:
    build: ./ml-service
    ports:
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - ./ml-service/data:/app/data:ro

# Nota: el servicio Laravel no se construye aquí por simplicidad; el objetivo es
# proporcionar un despliegue replicable del microservicio ML junto al proyecto.
