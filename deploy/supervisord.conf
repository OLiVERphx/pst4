; Procesos del contenedor. Si uno se cae, supervisor lo levanta de nuevo.
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = php-fpm -F
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Tareas programadas (routes/console.php): tasa BCV, respaldo diario, reporte semanal...
; En un servidor normal sería un cron; aquí no hay cron, por eso schedule:work.
[program:planificador]
command = php /app/artisan schedule:work
user = www-data
directory = /app
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
