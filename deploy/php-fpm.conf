[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
; Las variables de Railway deben llegar a PHP
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Pocos procesos: el plan Hobby cobra por RAM usada
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
